<style>

<script>
'use strict';
const DATA=__DATA__;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='image-style-public-favorites-v1',LANG_KEY='image-style-language-v1';
const M={
zh:{app:'图像风格选型台',eyebrow:'AI生成场景精选',intro:'{n}项电影、写实与三维场景参考。先看图，再选表现方向。',disclosure:'AI生成示例 · 童耀辉选定与整理 · 完全离线 · 不连接生图服务',keywords:'关键词（空格分隔）',searchHint:'名称、特点、用途；支持中英文搜索',series:'风格系列',allSeries:'全部系列',use:'用途',allUses:'全部用途',favoritesOnly:'只看收藏',reset:'清除筛选',clearCompare:'清空比较',export:'导出收藏',import:'导入收藏',count:'显示 {n} / {total} 项',selection:'比较 {n} / 3',workHint:'组合模板跟随当前语言；原始样图提示词保留英文供核对。',subject:'主题与画面内容',subjectHint:'例如：一只白猫穿过雨后的老街',ratio:'画幅比例',purpose:'用途',purposeHint:'例如：故事封面',space:'留白要求',avoid:'避免元素',spaceDefault:'适量留白',avoidDefault:'水印、多余文字',prompt:'组合提示词',copy:'复制提示词',manual:'手动选择全文',source:'核对模板与样图生成提示词',storageHint:'收藏保存在当前浏览器本地；换浏览器、移动文件夹、清理数据或换设备可能丢失，请导出JSON备份再导入。收藏不跨设备同步。主题内容不保存；仅记住您选择的界面语言。',contentHint:'图片为AI生成，不是真实摄影或影视剧照；名称表示视觉方向。代码与随附演示按MIT提供，以依法享有的权利为限。自备图册须另行确认许可。',license:'MIT许可证',contentLink:'内容与来源说明',guide:'使用说明',choose:'选用风格',addCompare:'加入比较',removeCompare:'移出比较',favorite:'收藏',favorited:'已收藏',suitable:'适合',template:'中文组合模板',openImage:'打开原尺寸示例图',sample:'示例图',noResults:'没有匹配风格。请减少关键词或清除筛选。',workTitle:'{name} · 提示词工作台',compareLabel:'并排比较',gridLabel:'风格图册',limit:'最多比较3项。请先移出一项，再加入。',storeFail:'无法保存到浏览器，请导出收藏备份。',readFail:'本地收藏存储不可用，仍可在本次使用并导出。',manualStatus:'已选择全文，请按 ⌘C（Mac）或 Ctrl+C（Windows）复制。',copied:'已复制',imported:'收藏已合并导入。',importFail:'导入失败：请选择本工具导出的有效收藏JSON。',download:'图像风格收藏.json',phSubject:'主体',phRatio:'比例',phPurpose:'用途',phSpace:'要求',phAvoid:'元素'},
en:{app:'Image Style Selector',eyebrow:'AI-generated scene references',intro:'{n} cinematic, realistic and 3D scene references. Browse the images, then choose a visual direction.',disclosure:'AI-generated examples · Selected and curated by Tong Yaohui · Fully offline · No image-generation service connected',keywords:'Keywords (separate with spaces)',searchHint:'Search in English or Chinese',series:'Collection',allSeries:'All collections',use:'Suggested use',allUses:'All uses',favoritesOnly:'Favorites only',reset:'Reset filters',clearCompare:'Clear comparison',export:'Export favorites',import:'Import favorites',count:'Showing {n} / {total} items',selection:'Compare {n} / 3',workHint:'The reusable template follows the selected language. Original image-generation prompts remain in English for reference.',subject:'Subject and scene',subjectHint:'For example: a white cat walking through an old street after rain',ratio:'Aspect ratio',purpose:'Intended use',purposeHint:'For example: a story cover',space:'Negative space',avoid:'Elements to avoid',spaceDefault:'Moderate negative space',avoidDefault:'Watermarks, extra text',prompt:'Combined prompt',copy:'Copy prompt',manual:'Select all text',source:'View templates and image-generation prompts',storageHint:'Favorites stay in this browser. Switching browsers, moving the folder, clearing browser data or changing devices may remove them. Export a JSON backup and import it in the new location; favorites do not sync across devices. Subject text is not saved. Only your interface language preference is remembered.',contentHint:'Images are AI-generated, not real photographs or film stills. Names describe visual directions. Code and bundled demos are provided under MIT to the extent applicable rights are held. Check licenses separately for custom catalogs.',license:'MIT License',contentLink:'Content and provenance',guide:'User guide',choose:'Use this style',addCompare:'Compare',removeCompare:'Remove from comparison',favorite:'Favorite',favorited:'Favorited',suitable:'Suggested uses',template:'English reusable template',openImage:'Open full-size reference image',sample:'reference image',noResults:'No matching references. Try fewer keywords or reset the filters.',workTitle:'{name} · Prompt workbench',compareLabel:'Side-by-side comparison',gridLabel:'Reference gallery',limit:'Compare up to 3 items. Remove one before adding another.',storeFail:'Could not save in this browser. Export a favorites backup.',readFail:'Local favorites storage is unavailable. You can still use and export favorites in this session.',manualStatus:'All text selected. Press ⌘C (Mac) or Ctrl+C (Windows) to copy.',copied:'Copied',imported:'Favorites merged successfully.',importFail:'Import failed. Choose a valid favorites JSON exported by this tool.',download:'image-style-favorites.json',phSubject:'subject',phRatio:'ratio',phPurpose:'purpose',phSpace:'space',phAvoid:'avoid'}
};
let lang='zh',favorites=new Set(),compare=[],chosen=null,noticeKey='';
try{const stored=localStorage.getItem(LANG_KEY);if(stored==='en'||stored==='zh')lang=stored}catch(e){}
const requested=new URLSearchParams(location.search).get('lang');if(requested==='zh'||requested==='en')lang=requested;
const tr=(k,v={})=>(M[lang][k]||k).replace(/\{(\w+)\}/g,(_,n)=>v[n]??'{'+n+'}');
const localized=d=>lang==='en'&&d.en?d.en:d;
const name=d=>localized(d).name;
const usesZh=d=>d.uses.split('、');
const useLabels=new Map(),groupLabels=new Map();
for(const d of DATA){groupLabels.set(d.group,d.en?.group||d.group);usesZh(d).forEach((u,i)=>{if(!useLabels.has(u))useLabels.set(u,d.en?.uses?.[i]||u)})}
const useText=d=>lang==='en'&&d.en?d.en.uses.join(', '):d.uses;
const validId=n=>Number.isInteger(n)&&DATA.some(d=>d.id===n);
try{let a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))favorites=new Set(a.filter(validId))}catch(e){noticeKey='readFail'}
function tell(k){noticeKey=k;$('notice').textContent=k?tr(k):''}
function save(){try{localStorage.setItem(KEY,JSON.stringify([...favorites]))}catch(e){tell('storeFail')}}
function fillFilters(){const g=$('group').value,u=$('use').value;$('group').innerHTML='<option value="">'+esc(tr('allSeries'))+'</option>'+[...groupLabels].map(([zh,en])=>`<option value="${esc(zh)}">${esc(lang==='en'?en:zh)}</option>`).join('');$('group').value=g;$('use').innerHTML='<option value="">'+esc(tr('allUses'))+'</option>'+[...useLabels].sort((a,b)=>(lang==='en'?a[1]:a[0]).localeCompare(lang==='en'?b[1]:b[0],lang==='en'?'en':'zh')).map(([zh,en])=>`<option value="${esc(zh)}">${esc(lang==='en'?en:zh)}</option>`).join('');$('use').value=u}
function setLanguage(next,persist=true){const before=lang;lang=next;document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=tr('app')+' · '+DATA.length;$('language').value=lang;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(e=>e.placeholder=tr(e.dataset.placeholder));$('intro').textContent=tr('intro',{n:DATA.length});for(const [id,k] of [['space','spaceDefault'],['avoid','avoidDefault']])if($(id).value===M[before][k])$(id).value=tr(k);$('compare').ariaLabel=tr('compareLabel');$('grid').ariaLabel=tr('gridLabel');$('output').ariaLabel=tr('prompt');$('contentLink').href=lang==='en'?'CONTENT_NOTICE.en.md':'CONTENT_NOTICE.md';$('guideLink').href=lang==='en'?'使用说明.html?lang=en':'使用说明.html?lang=zh';if(persist)try{localStorage.setItem(LANG_KEY,lang)}catch(e){}fillFilters();tell(noticeKey);render();if(chosen)showChosen()}
function render(){const terms=$('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);const rows=DATA.filter(d=>(!$('group').value||d.group===$('group').value)&&(!$('use').value||usesZh(d).includes($('use').value))&&(!$('favOnly').checked||favorites.has(d.id))&&terms.every(t=>[d.title,d.features,d.uses,d.group,d.original,d.en?.title,d.en?.features,d.en?.uses?.join(' '),d.en?.group].join(' ').toLowerCase().includes(t)));$('count').textContent=tr('count',{n:rows.length,total:DATA.length});$('selection').textContent=tr('selection',{n:compare.length});$('grid').innerHTML=rows.length?rows.map(d=>`<article class="card" data-id="${d.id}"><a href="${esc(d.image)}" target="_blank" rel="noopener" title="${esc(tr('openImage'))}"><img loading="lazy" src="${esc(d.image)}" alt="${esc(name(d)+' '+tr('sample'))}"></a><div class="body"><small>${d.id} / ${esc(localized(d).group)}</small><h3>${esc(name(d))}</h3><p>${esc(localized(d).features)}</p><p><small>${esc(tr('suitable'))}:</small> ${esc(useText(d))}</p><div class="actions"><button data-action="choose">${esc(tr('choose'))}</button><button data-action="compare" aria-pressed="${compare.includes(d.id)}">${esc(tr(compare.includes(d.id)?'removeCompare':'addCompare'))}</button><button data-action="favorite" aria-pressed="${favorites.has(d.id)}">${esc(tr(favorites.has(d.id)?'favorited':'favorite'))}</button></div></div></article>`).join(''):`<p>${esc(tr('noResults'))}</p>`;renderCompare()}
function renderCompare(){$('compare').innerHTML=compare.map(id=>{const d=DATA.find(d=>d.id===id);return `<article data-id="${id}"><a href="${esc(d.image)}" target="_blank" rel="noopener"><img src="${esc(d.image)}" alt="${esc(name(d))}"></a><h3>${esc(name(d))}</h3><p>${esc(localized(d).features)}</p><p>${esc(tr('suitable'))}: ${esc(useText(d))}</p><details><summary>${esc(tr('template'))}</summary><pre>${esc(localized(d).template)}</pre></details><button data-action="choose">${esc(tr('choose'))}</button> <button data-action="compare">${esc(tr('removeCompare'))}</button></article>`}).join('')}
function showChosen(){$('work').hidden=false;$('chosen').textContent=tr('workTitle',{name:name(chosen)});$('original').textContent=localized(chosen).source;generate()}
function choose(id){chosen=DATA.find(d=>d.id===id);showChosen();$('work').scrollIntoView({behavior:'smooth',block:'start'})}
function generate(){if(!chosen)return;const vals={subject:$('subject').value.trim()||'['+tr('phSubject')+']',ratio:$('ratio').value.trim()||'['+tr('phRatio')+']',purpose:$('purpose').value.trim()||'['+tr('phPurpose')+']',space:$('space').value.trim()||'['+tr('phSpace')+']',avoid:$('avoid').value.trim()||'['+tr('phAvoid')+']'};const aliases={'主体':'subject','比例':'ratio','用途':'purpose','要求':'space','元素':'avoid'};$('output').value=localized(chosen).template.replace(/\[(主体|比例|用途|要求|元素|subject|ratio|purpose|space|avoid)\]/g,(_,k)=>vals[aliases[k]||k]);$('copyStatus').textContent=''}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const id=Number(b.closest('[data-id]').dataset.id);if(b.dataset.action==='choose')return choose(id);if(b.dataset.action==='favorite'){favorites.has(id)?favorites.delete(id):favorites.add(id);save()}else if(compare.includes(id))compare=compare.filter(n=>n!==id);else if(compare.length<3)compare.push(id);else{tell('limit');return}render()});
for(const id of ['q','group','use','favOnly'])$(id).addEventListener('input',render);for(const id of ['subject','ratio','purpose','space','avoid'])$(id).addEventListener('input',generate);
$('language').onchange=()=>setLanguage($('language').value);$('reset').onclick=()=>{$('q').value='';$('group').value='';$('use').value='';$('favOnly').checked=false;tell('');render()};$('clearCompare').onclick=()=>{compare=[];render()};
function manual(){$('output').focus();$('output').select();$('copyStatus').textContent=tr('manualStatus')}$('manual').onclick=manual;$('copy').onclick=async()=>{try{if(!navigator.clipboard)throw Error('clipboard unavailable');await navigator.clipboard.writeText($('output').value);$('copyStatus').textContent=tr('copied')}catch(e){manual()}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:KEY,version:1,ids:[...favorites]},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=tr('download');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importButton').onclick=()=>$('import').click();$('import').onchange=async()=>{try{const f=$('import').files[0];if(!f)return;if(f.size>100000)throw Error('size');const v=JSON.parse(await f.text());if(v.format!==KEY||v.version!==1||!Array.isArray(v.ids)||!v.ids.every(validId))throw Error('format');favorites=new Set([...favorites,...v.ids]);save();render();tell('imported')}catch(e){tell('importFail')}finally{$('import').value=''}};
$('space').value=M[lang].spaceDefault;$('avoid').value=M[lang].avoidDefault;setLanguage(lang,false);
</script></html>
